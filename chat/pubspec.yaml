name: chatapp
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  flutter_riverpod: ^2.4.9
  local_auth: ^2.3.0
  firebase_messaging: ^15.0.0
  onesignal_flutter: ^5.2.0
  http: ^1.1.0
  agora_rtc_engine: ^6.3.4
  url_launcher: ^6.2.2
  permission_handler: ^11.3.1
  get: ^4.6.6
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  flutter_launcher_icons:

flutter:

  uses-material-design: true

  assets:
    - assets/image/

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/image/ghost_chat_logo.png"
  adaptive_icon_background: "#1E88E5" # Matches the blue in the logo I generated
  adaptive_icon_foreground: "assets/image/ghost_chat_logo.png"