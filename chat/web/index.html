<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="chatapp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>chatapp</title>
  <link rel="manifest" href="manifest.json">

  <!-- 
    NOTE: Manual Agora/Iris scripts have been removed to let the agora_rtc_engine 6.3.4 
    plugin manage its own internal assets. This prevents version shadowing conflicts.
  -->

  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Modern Flutter Web Loading API (Replaces deprecated loadEntrypoint)
      _flutter.loader.load({
        serviceWorkerSettings: {
          serviceWorkerVersion: null, // Let Flutter decide the version
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
